<!-- Landscape Overlay Component -->
<div
  class="fixed inset-0 bg-black bg-opacity-90 text-white text-center flex flex-col items-center justify-center z-50 p-6 landscape:flex animate-fadeIn"
>
  <!-- Rotating phone SVG -->
  <svg
    xmlns="http://www.w3.org/2000/svg"
    class="h-20 w-20 mb-6 animate-spin-slow"
    fill="none"
    viewBox="0 0 24 24"
    stroke="currentColor"
    stroke-width="2"
  >
    <rect
      x="7"
      y="2"
      width="10"
      height="20"
      rx="2"
      ry="2"
      stroke="currentColor"
      stroke-width="2"
    />
    <circle cx="12" cy="19" r="1" stroke="currentColor" stroke-width="2" />
  </svg>

  <p class="text-2xl font-semibold">
    Please return your phone to portrait orientation.
  </p>
</div>

<!-- Tailwind animation (in your global CSS or styles.css) -->
<style>
  @keyframes fadeIn {
    from {
      opacity: 0;
    }
    to {
      opacity: 1;
    }
  }

  /* Fade-in for the overlay */
  .animate-fadeIn {
    animation: fadeIn 0.5s ease-in-out forwards;
  }

  /* Custom slow spin for SVG */
  @keyframes spinSlow {
    from {
      transform: rotate(0deg);
    }
    to {
      transform: rotate(360deg);
    }
  }

  .animate-spin-slow {
    animation: spinSlow 2s linear infinite;
  }
</style>
